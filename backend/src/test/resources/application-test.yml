# Perfil de pruebas de integración: el datasource lo inyecta
# PostgresIntegrationTest con @DynamicPropertySource (PostgreSQL embebido).
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-minimo-256-bits-para-pruebas-de-integracion-maxli
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173
