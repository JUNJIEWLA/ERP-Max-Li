spring:
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:maxli-dev-secret-key-minimo-256-bits-no-usar-en-prod}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.maxli: INFO
