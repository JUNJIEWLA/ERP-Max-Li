<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-gold-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB68"/>
      <stop offset="60%" stop-color="#F5C832"/>
      <stop offset="100%" stop-color="#E2B11B"/>
    </linearGradient>
    <linearGradient id="logo-gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF38B"/>
      <stop offset="100%" stop-color="#EDBC26"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Left Mountain Peak -->
    <path d="M 90,310 L 205,105 L 245,285 L 210,285 L 188,200 L 125,310 Z" fill="url(#logo-gold-main)" />
    <!-- Inner Left Chevron Fold -->
    <path d="M 160,250 L 205,150 L 230,260 L 210,260 L 195,200 L 175,250 Z" fill="url(#logo-gold-light)" />

    <!-- Right Mountain Peak (Taller) -->
    <path d="M 298,35 L 410,310 L 350,310 L 298,165 L 255,310 L 215,310 L 285,115 Z" fill="url(#logo-gold-main)" />
    <!-- Inner Right Chevron Fold -->
    <path d="M 285,115 L 325,210 L 275,310 L 255,310 L 295,200 L 275,150 Z" fill="url(#logo-gold-light)" />
  </g>

  <!-- MAX LI Brand Text -->
  <text x="250" y="440" text-anchor="middle" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="76" fill="#0F0C29" letter-spacing="4">MAX LI</text>
</svg>
