name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un PR que recibe varios push seguidos no necesita mantener vivos los jobs
# anteriores: solo importa el último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Superficies del piloto
        run: npm run check:pilot

      # Los scripts de operación son código: deciden si se abre la tienda y si
      # un respaldo sirve. Sin CI, un cambio que los rompa pasa inadvertido
      # hasta el día del incidente. No necesitan PostgreSQL.
      - name: Contratos de los scripts de operación
        run: bash ops/verificar-scripts.sh

      # Salida temporal: el dist/ versionado del piloto no se toca.
      - name: Build del frontend
        run: npm run build -- --outDir "$RUNNER_TEMP/dist-ci" --emptyOutDir

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev

      - name: Pruebas del backend
        working-directory: backend
        run: mvn -B test

  e2e:
    name: E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          # Credenciales EXCLUSIVAS de la base efímera del CI: este contenedor
          # nace y muere con el job y jamás contiene datos reales. No usar
          # ningún secreto productivo aquí.
          POSTGRES_DB: maxli_e2e
          POSTGRES_USER: maxli_e2e
          POSTGRES_PASSWORD: maxli_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxli_e2e -d maxli_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # El perfil dev no declara datasource (lo aporta application-dev.yml, que
      # es local y no está en Git). En CI la conexión llega por entorno: las
      # variables SPRING_DATASOURCE_* ganan sobre cualquier fichero, así que el
      # arranque no depende de ningún application-dev.yml.
      DB_URL: jdbc:postgresql://127.0.0.1:5432/maxli_e2e
      DB_USER: maxli_e2e
      DB_PASSWORD: maxli_e2e
      BOOTSTRAP_ADMIN_PASSWORD: E2eBootstrap#2026
      JWT_EXPIRATION: 8h
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      E2E_BASE_URL: http://127.0.0.1:5173

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Empaquetar el backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Arrancar el backend (perfil dev, base maxli_e2e)
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: ${{ env.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ env.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          nohup java -jar backend/target/*.jar > backend-e2e.log 2>&1 &
          echo $! > backend.pid

      - name: Esperar readiness del backend
        run: |
          for intento in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'; then
              echo "Backend listo tras ${intento} intentos."
              exit 0
            fi
            sleep 2
          done
          echo "El backend no alcanzó readiness."
          exit 1

      # Solo sobre maxli_e2e: el propio SQL aborta si la base conectada es otra.
      - name: Preparar el fixture E2E
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: ${{ env.DB_USER }}
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: npm run e2e:fixture

      - name: Arrancar el frontend (Vite)
        run: |
          nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > vite-e2e.log 2>&1 &
          echo $! > vite.pid
          for intento in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then
              echo "Vite listo tras ${intento} intentos."
              exit 0
            fi
            sleep 2
          done
          echo "Vite no llegó a servir el SPA."
          exit 1

      - name: E2E del flujo principal
        timeout-minutes: 10
        run: npm run test:e2e

      # ── Operación ────────────────────────────────────────────────
      # Van al final para no retrasar el feedback del flujo principal, pero
      # cuentan igual: si fallan, el check E2E queda en rojo.
      #
      # Reutilizan el PostgreSQL efímero de este job, que nace y muere con él.
      # Crean sus propias bases (maxli_gate_*, maxli_ensayo_*) y las borran
      # pase lo que pase; maxli_e2e no se toca.

      # El cliente tiene que ser al menos tan nuevo como el servidor: un pg_dump
      # más viejo que la base se niega a volcar, y el fallo parecería del script.
      - name: Cliente de PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Gate de salida a piloto
        timeout-minutes: 10
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: ${{ env.DB_USER }}
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: bash ops/verificar-gate-prepiloto.sh

      - name: Ensayo backup, copia externa y restauración
        timeout-minutes: 10
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: ${{ env.DB_USER }}
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: bash ops/ensayo-backup-restore.sh

      - name: Evidencia del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fallo
          path: |
            playwright-report/
            test-results/
            backend-e2e.log
            vite-e2e.log
          retention-days: 7
          if-no-files-found: ignore
